apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api-service
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer
  selector:
    app: heart-disease-api
  ports:
    - name: http
      protocol: TCP
      port: 8000        # Service port inside cluster / LoadBalancer external port
      targetPort: 8000  # Container port exposed by Uvicorn
      nodePort: 30080   # Fixed NodePort (30000-32767) for easy Minikube access
 